# ═══════════════════════════════════════════════════════════════════════════
#  Голосовые команды Jarvis  —  ДЕФОЛТНЫЙ каталог (config/commands.example.toml)
# ═══════════════════════════════════════════════════════════════════════════
#
#  Этот файл — встроенный каталог «из коробки»: базовые функции системы, которые
#  Джарвис выполняет МГНОВЕННО, не обращаясь к нейросети (произнесённая фраза
#  совпала → команда запущена). Он в git и обновляется обычным `git pull`.
#
#  ── Где добавлять СВОИ команды ─────────────────────────────────────────────
#  НЕ правь этот файл (его перезапишет обновление). Свои команды клади в личный
#  файл  config/commands.toml  — он в .gitignore и НАКЛАДЫВАЕТСЯ СВЕРХУ этого
#  каталога: твои записи дополняют дефолты, а при совпадении фразы — выигрывают
#  (так можно переопределить любую встроенную команду). Быстрый путь:
#       jarvis commands       # создаст личный файл и откроет в редакторе
#  Сохрани файл — Джарвис сам перезапустится и подхватит изменения (за config/
#  следит автоперезагрузка). Ничего вручную перезапускать не нужно.
#
#  ── Поля записи [[command]] ────────────────────────────────────────────────
#    phrases      (обязательно) список фраз; ЛЮБАЯ из них запускает команду.
#                 Пиши так, как реально говоришь. Можно несколько синонимов.
#    run          (обязательно) shell-команда. Поддерживаются ||, &&, ~, $HOME.
#                 Для устойчивости перечисляй варианты бинарей через ||.
#    say          (необязательно) что Джарвис ответит голосом. По умолчанию
#                 «Готово, сэр.»
#    spawn        (необязательно) true — для GUI-программ (запуск в фоне, ответ
#                 сразу). false/опущено — дождаться завершения короткой команды.
#    destructive  (необязательно) true — Джарвис СПРОСИТ подтверждение голосом
#                 перед запуском (для опасных команд: выключение, удаление).
#    id           (необязательно) свой идентификатор. По умолчанию из 1-й фразы.
#    category     (необязательно) SYSTEM_OPS | UI_CONTROL | PENTEST_RECON.
#
#  Безопасность: команда исполняется РОВНО как написана здесь — никакие части
#  распознанной речи в shell не попадают. Опасные команды помечай destructive.
#
#  Базовые приложения (браузер, файлы, настройки, редактор, терминал, звук,
#  яркость, окна, медиа, скриншоты) уже знает встроенный Python-каталог — говори
#  «открой браузер», «открой настройки», «громче», «скриншот» и т.п. Здесь —
#  то, чего там нет: питание, папки, сеть, буфер обмена, обновления и прочее.
# ═══════════════════════════════════════════════════════════════════════════


# ───────────────────────────── Питание / сессия ─────────────────────────────
# Опасное помечено destructive — Джарвис переспросит голосом перед запуском,
# чтобы случайная ослышка не выключила машину.

[[command]]
phrases = ["выключи компьютер", "выключи систему", "заверши работу", "выключение", "выруби компьютер"]
run = "systemctl poweroff || shutdown -h now || poweroff"
destructive = true
say = "Выключаю систему, сэр."

[[command]]
phrases = ["перезагрузи компьютер", "перезагрузи систему", "ребут", "перезагрузка", "рестарт системы"]
run = "systemctl reboot || reboot || shutdown -r now"
destructive = true
say = "Перезагружаю систему, сэр."

[[command]]
phrases = ["усни", "спящий режим", "уйди в сон", "режим сна", "ждущий режим", "засыпай"]
run = "systemctl suspend || loginctl suspend"
say = "Ухожу в спящий режим, сэр."

[[command]]
phrases = ["гибернация", "гибернируй", "сон на диск", "глубокий сон"]
run = "systemctl hibernate || loginctl hibernate"
say = "Гибернация, сэр."


# ───────────────────────────── Папки (XDG) ─────────────────────────────
# xdg-user-dir даёт локализованный путь (Загрузки/Документы…); если его нет —
# откатываемся на классический английский путь в $HOME.

[[command]]
phrases = ["открой загрузки", "папка загрузки", "покажи загрузки", "открой даунлоадс"]
run = "xdg-open \"$(xdg-user-dir DOWNLOAD 2>/dev/null || echo \"$HOME/Downloads\")\""
spawn = true
say = "Открываю загрузки, сэр."

[[command]]
phrases = ["открой документы", "папка документы", "мои документы", "покажи документы"]
run = "xdg-open \"$(xdg-user-dir DOCUMENTS 2>/dev/null || echo \"$HOME/Documents\")\""
spawn = true
say = "Открываю документы, сэр."

[[command]]
phrases = ["открой изображения", "открой картинки", "папка с картинками", "мои изображения", "открой фотографии"]
run = "xdg-open \"$(xdg-user-dir PICTURES 2>/dev/null || echo \"$HOME/Pictures\")\""
spawn = true
say = "Открываю изображения, сэр."

[[command]]
phrases = ["открой музыку", "папка музыка", "моя музыка", "покажи музыку"]
run = "xdg-open \"$(xdg-user-dir MUSIC 2>/dev/null || echo \"$HOME/Music\")\""
spawn = true
say = "Открываю музыку, сэр."

[[command]]
phrases = ["открой видео", "папка видео", "мои видео", "покажи видео"]
run = "xdg-open \"$(xdg-user-dir VIDEOS 2>/dev/null || echo \"$HOME/Videos\")\""
spawn = true
say = "Открываю видео, сэр."

[[command]]
phrases = ["открой домашнюю папку", "домашняя папка", "открой домашний каталог", "открой хоум"]
run = "xdg-open \"$HOME\""
spawn = true
say = "Открываю домашнюю папку, сэр."

[[command]]
phrases = ["открой корзину", "папка корзина", "покажи корзину"]
run = "xdg-open trash:/ || dolphin trash:/ || nautilus trash:///"
spawn = true
say = "Открываю корзину, сэр."

[[command]]
phrases = ["открой корень", "корневая папка", "файловая система", "открой рут"]
run = "xdg-open / || dolphin / || nautilus /"
spawn = true
say = "Открываю корень файловой системы, сэр."


# ───────────────────────────── Сеть ─────────────────────────────
# nmcli — основной путь (NetworkManager); rfkill / bluetoothctl — резерв.

[[command]]
phrases = ["включи вайфай", "включи wi-fi", "включи беспроводную сеть", "вай фай включи"]
run = "nmcli radio wifi on || rfkill unblock wifi"
say = "Включаю Wi-Fi, сэр."

[[command]]
phrases = ["выключи вайфай", "выключи wi-fi", "отключи беспроводную сеть", "вай фай выключи"]
run = "nmcli radio wifi off || rfkill block wifi"
say = "Выключаю Wi-Fi, сэр."

[[command]]
phrases = ["включи блютуз", "включи bluetooth", "блютуз включи"]
run = "rfkill unblock bluetooth || bluetoothctl power on"
say = "Включаю Bluetooth, сэр."

[[command]]
phrases = ["выключи блютуз", "выключи bluetooth", "блютуз выключи"]
run = "rfkill block bluetooth || bluetoothctl power off"
say = "Выключаю Bluetooth, сэр."

[[command]]
phrases = ["режим полёта", "самолётный режим", "авиарежим", "включи режим полёта"]
run = "nmcli radio all off || rfkill block all"
say = "Включаю режим полёта, сэр."

[[command]]
phrases = ["выключи режим полёта", "выключи авиарежим", "верни связь", "включи всю связь"]
run = "nmcli radio all on || rfkill unblock all"
say = "Связь восстановлена, сэр."

[[command]]
phrases = ["открой настройки сети", "сетевые подключения", "управление сетью"]
run = "nm-connection-editor || systemsettings kcm_networkmanagement || gnome-control-center network"
spawn = true
say = "Открываю настройки сети, сэр."


# ───────────────────────────── Буфер обмена ─────────────────────────────

[[command]]
phrases = ["очисти буфер обмена", "очисти буфер", "сотри буфер обмена"]
run = "qdbus org.kde.klipper /klipper org.kde.klipper.klipper.clearClipboardHistory || wl-copy --clear || printf '' | xclip -selection clipboard"
say = "Буфер обмена очищен, сэр."


# ───────────────────────────── Система / инструменты ─────────────────────────────

[[command]]
phrases = ["проверь обновления", "центр обновлений", "посмотри обновления", "есть ли обновления"]
run = "plasma-discover --mode update || gnome-software --mode=updates || xdg-open appstream:"
spawn = true
say = "Открываю центр обновлений, сэр."

[[command]]
phrases = ["пипетка", "выбери цвет", "цвет с экрана", "пипетка цвета"]
run = "kcolorchooser || gpick || gcolor3"
spawn = true
say = "Открываю пипетку, сэр."

[[command]]
phrases = ["эмодзи", "смайлики", "открой эмодзи", "панель эмодзи"]
run = "plasma-emojier || ibus emoji || gnome-characters"
spawn = true
say = "Открываю эмодзи, сэр."

[[command]]
phrases = ["заблокируй экран", "блокировка экрана", "запри систему", "залочь экран"]
run = "loginctl lock-session || qdbus org.kde.ScreenSaver /ScreenSaver Lock || xdg-screensaver lock"
say = "Блокирую экран, сэр."


# ───────────────────────────── Очистка / обслуживание ─────────────────────────────
# Разрушительное — с подтверждением голосом (destructive=true).

[[command]]
phrases = ["очисти корзину", "опустоши корзину", "вынеси мусор"]
run = "rm -rf \"$HOME/.local/share/Trash/files/\"* \"$HOME/.local/share/Trash/info/\"*"
destructive = true
say = "Корзина очищена, сэр."
