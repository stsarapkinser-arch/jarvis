# Конфиг pytest ДОЛЖЕН лежать в корне репо: pytest ищет ini-файл от общего
# предка аргументов вверх по дереву и НЕ заглядывает в config/. Раньше настройки
# жили в config/pyproject.toml и молча игнорировались (rootdir определялся, но
# configfile — пустой), поэтому filterwarnings/testpaths не применялись. Ruff
# свой конфиг в config/pyproject.toml находит сам, а pytest — нет: его держим тут.
[pytest]
minversion = 7.0
testpaths = tests
# asyncio_mode не нужен: async-тесты гоняет адаптер в tests/conftest.py
# (pytest_pyfunc_call → asyncio.run), без зависимости от pytest-asyncio.
filterwarnings =
    ignore::DeprecationWarning:chromadb.*
    # Транзитивная зависимость chromadb (opentelemetry) — шум не наш.
    ignore::DeprecationWarning:opentelemetry.*
