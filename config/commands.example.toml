# ═══════════════════════════════════════════════════════════════════════════
#  Пользовательские голосовые команды Jarvis  —  config/commands.toml
# ═══════════════════════════════════════════════════════════════════════════
#
#  Сюда ты ВРУЧНУЮ добавляешь свои команды. Джарвис выполняет их МГНОВЕННО, не
#  обращаясь к нейросети: произнесённая фраза совпала → команда запущена.
#
#  Просто сохрани файл — Джарвис сам перезапустится и подхватит изменения
#  (за config/ следит автоперезагрузка). Ничего вручную перезапускать не нужно.
#
#  ── Как добавить команду ──────────────────────────────────────────────────
#  Скопируй блок [[command]] и заполни поля:
#
#    phrases      (обязательно) список фраз; ЛЮБАЯ из них запускает команду.
#                 Пиши так, как реально говоришь. Можно несколько синонимов.
#    run          (обязательно) shell-команда. Поддерживаются ||, &&, ~, $HOME.
#                 Для устойчивости перечисляй варианты бинарей через ||.
#    say          (необязательно) что Джарвис ответит голосом. По умолчанию
#                 «Готово, сэр.»
#    spawn        (необязательно) true — для GUI-программ (запуск в фоне, ответ
#                 сразу). false/опущено — дождаться завершения короткой команды.
#    destructive  (необязательно) true — Джарвис СПРОСИТ подтверждение голосом
#                 перед запуском (для опасных команд: удаление, выключение).
#    id           (необязательно) свой идентификатор. По умолчанию из 1-й фразы.
#    category     (необязательно) SYSTEM_OPS | UI_CONTROL | PENTEST_RECON.
#
#  Безопасность: команда исполняется РОВНО как написана здесь — никакие части
#  распознанной речи в shell не попадают. Опасные команды помечай destructive.
#
#  Базовые приложения (браузер, файлы, настройки, редактор, терминал и т.д.) уже
#  знает встроенный каталог — говори «открой браузер», «открой настройки» и т.п.
#  Этот файл — для ТВОИХ команд сверх него.
# ═══════════════════════════════════════════════════════════════════════════

[[command]]
phrases = ["заблокируй экран", "блокировка экрана", "запри систему", "залочь экран"]
run = "loginctl lock-session || xdg-screensaver lock || qdbus org.freedesktop.ScreenSaver /ScreenSaver Lock"
say = "Блокирую экран, сэр."

[[command]]
phrases = ["открой загрузки", "папка загрузки", "покажи загрузки", "открой даунлоадс"]
run = "xdg-open \"$HOME/Downloads\" || dolphin \"$HOME/Downloads\""
spawn = true
say = "Открываю загрузки, сэр."

[[command]]
phrases = ["открой домашнюю папку", "домашняя папка", "открой домашний каталог", "открой хоум"]
run = "xdg-open \"$HOME\" || dolphin \"$HOME\""
spawn = true
say = "Открываю домашнюю папку, сэр."

[[command]]
phrases = ["очисти корзину", "опустоши корзину", "вынеси мусор"]
run = "rm -rf \"$HOME/.local/share/Trash/files/\"* \"$HOME/.local/share/Trash/info/\"*"
destructive = true
say = "Корзина очищена, сэр."
