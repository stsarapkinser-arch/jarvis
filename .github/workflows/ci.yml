name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check .

      - name: Install runtime + test dependencies
        # PyQt6 и нативный llama-server не нужны для unit-тестов и тянут тяжёлые
        # системные зависимости — ставим только то, на чём держатся тесты.
        # httpx — клиент к llama-server (импорт мягкий, тесты транспорта его юзают).
        run: |
          pip install pytest pytest-asyncio numpy chromadb ollama httpx

      - name: pytest
        run: pytest tests/ -q
